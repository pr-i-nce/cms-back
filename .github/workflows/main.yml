name: Deploy CMS to cPanel

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build application
        run: |
          npm ci
          npx prisma generate
          npm run build

      - name: Assemble cPanel deployment package
        run: |
          mkdir -p deploy_package
          cp -r dist prisma deploy_package/
          cp app.js package.json package-lock.json deploy_package/

      - name: Upload files over SFTP
        uses: wangyucode/sftp-upload-action@v3
        with:
          host: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT || 22 }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          privateKey: ${{ secrets.SFTP_PRIVATE_KEY }}
          passphrase: ${{ secrets.SFTP_PASSPHRASE }}
          localDir: deploy_package
          remoteDir: ${{ secrets.SFTP_REMOTE_DIR }}
          concurrency: 4
