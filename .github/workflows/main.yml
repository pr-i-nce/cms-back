name: Build CMS Backend

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Prisma client generation needs a datasource URL but does not connect.
      DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build_db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies and build
        run: |
          npm ci
          PRISMA_CLI_QUERY_ENGINE_TYPE=library npm run build

      - name: Prepare build artifact
        run: |
          mkdir -p build_artifact
          cp -r dist prisma build_artifact/
          cp app.js package.json package-lock.json prisma.config.ts build_artifact/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cms-backend-build
          path: build_artifact/
          if-no-files-found: error
          retention-days: 7
