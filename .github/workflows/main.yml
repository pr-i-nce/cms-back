name: Deploy CMS to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Prisma generation reads the datasource URL but never connects during build.
      DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build_db
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build backend
        run: |
          npm ci
          npm run build

      - name: Prepare deployment package
        run: |
          mkdir -p deploy_package
          cp -r dist prisma deploy_package/
          cp app.js package.json package-lock.json prisma.config.ts deploy_package/

      - name: Upload to cPanel with SFTP
        uses: wangyucode/sftp-upload-action@v3
        with:
          host: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT || 22 }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          privateKey: ${{ secrets.SFTP_PRIVATE_KEY }}
          passphrase: ${{ secrets.SFTP_PASSPHRASE }}
          localDir: deploy_package
          remoteDir: ${{ secrets.SFTP_REMOTE_DIR }}
          removeExtraFilesOnServer: false
          concurrency: 4
